[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-ulid>=3.0",
    "langgraph>=1.0",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "google-generativeai>=0.8",
    "google-genai>=1.0",
    "weasyprint>=62",
    "scapy>=2.5",
    "Levenshtein>=0.25",
    "httpx>=0.27",
    "selectolax>=0.3",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "pip-audit>=2.7",
    "aiofiles>=23.2",
    "structlog>=24.1",
    "slowapi>=0.1",
    "jinja2>=3.1",
    "ptyprocess>=0.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
