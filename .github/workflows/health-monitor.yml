name: Health Monitor

on:
  schedule:
    # Full health check every hour
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    name: Monitor backend & frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check backend /health
        id: backend
        run: |
          BACKEND_URL=$(echo "${{ secrets.RENDER_BACKEND_URL }}" | tr -d '[:space:]')
          STATUS=000
          RESPONSE=""
          # Render free tier cold-starts can take ~30-50s; retry to absorb that.
          # `|| true` keeps a curl timeout (exit 28) from killing the step under
          # `bash -e`, so the graceful "Fail if backend is down" check runs instead.
          for i in {1..4}; do
            RESPONSE=$(curl -s --max-time 30 "$BACKEND_URL/health" || true)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BACKEND_URL/health" || true)
            echo "Attempt $i — Backend status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 10
          done
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "Backend status: $STATUS | Response: $RESPONSE"

      - name: Check frontend
        id: frontend
        run: |
          FRONTEND_URL=$(echo "${{ secrets.VERCEL_FRONTEND_URL }}" | tr -d '[:space:]')
          for i in {1..3}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$FRONTEND_URL" || true)
            echo "Attempt $i — Frontend status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "status=$STATUS" >> $GITHUB_OUTPUT
              exit 0
            fi
            sleep 5
          done
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Check backend docs reachable
        run: |
          BACKEND_URL=$(echo "${{ secrets.RENDER_BACKEND_URL }}" | tr -d '[:space:]')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$BACKEND_URL/docs" || true)
          echo "API docs status: $STATUS"

      - name: Fail if backend is down
        if: steps.backend.outputs.status != '200'
        run: |
          echo "::error::Backend is DOWN — status ${{ steps.backend.outputs.status }}"
          exit 1

      - name: Warn if frontend is down
        if: steps.frontend.outputs.status != '200'
        run: |
          echo "::warning::Frontend returned ${{ steps.frontend.outputs.status }} — may still be deploying or cold starting"
