name: CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json"

  # Frontend is deployed automatically by Vercel on every push to main.
  # No extra job needed here.
